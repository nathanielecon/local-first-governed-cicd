[extend]
useDefault = true

[[allowlists]]
description = "Allow Docker base-image GPG metadata captured as runtime evidence"
paths = [
  '''evidence/phase-3/runtime/base-image-inspect\.json''',
  '''evidence/phase-3/runtime/image-inspect\.json''',
  '''evidence/phase-3/runtime/production-inspect\.json''',
  '''evidence/phase-3/runtime/runtime-env\.txt''',
  '''evidence/phase-3/runtime/staging-inspect\.json''',
]
regexes = [
  '''GPG_KEY=''',
]

[[allowlists]]
description = "Allow Jenkins plugin identifiers that resemble generic keys"
paths = [
  '''infra/jenkins/plugins\.txt''',
  '''tests/test_jenkins_casc_static\.py''',
  '''evidence/phase-5/p5-t11-.*\.txt''',
  '''evidence/phase-5/p5-t04-bottleneck-diff\.txt''',
]
regexes = [
  '''credentials-binding''',
]

[[allowlists]]
description = "Allow documented Phase 7 synthetic GitHub PAT test signature (not a live credential)"
paths = [
  '''scripts/phase7_run_lanes\.py''',
  '''tests/test_phase7_failure_injection\.py''',
  '''evidence/phase-7/credential/B-fake-cred-boundary-scan\.txt''',
  '''evidence/phase-7/supply-chain/A-fake-secret-gitleaks-reject\.txt''',
]
regexes = [
  '''ghp_012345678901234567890123456789012345''',
]
