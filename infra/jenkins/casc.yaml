jenkins:
  systemMessage: "Project C governed delivery controller. Configuration is managed as code."
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false
  globalNodeProperties:
    - envVars:
        env:
          REGISTRY: "localhost:5000"
unclassified:
  location:
    url: "http://localhost:8080/"
jobs:
  - script: >
      pipelineJob('project-c-delivery') {
        description('Build-once, digest-based delivery pipeline for Project C')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///workspace') }
                branch('*/master')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
