name: Implementation slice
description: A gated, evidence-producing unit of work
title: "[slice]: "
labels: ["status:planned"]
body:
  - type: textarea
    id: outcome
    attributes: {label: Outcome, description: Describe observable behavior, not an implementation activity.}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: List independently verifiable criteria.}
    validations: {required: true}
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: [low, medium, high]
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Required evidence, description: Name reports, tests, screenshots, logs, or decisions.}
    validations: {required: true}
  - type: textarea
    id: rollback
    attributes: {label: Rollback or recovery, description: Explain how the change is safely reversed.}
    validations: {required: true}

