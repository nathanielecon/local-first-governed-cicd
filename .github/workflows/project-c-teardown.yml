name: Project C manual teardown

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY-PROJECT-C-STAGING exactly
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-c-staging-teardown
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  teardown:
    if: github.event.inputs.confirm == 'DESTROY-PROJECT-C-STAGING'
    runs-on: ubuntu-latest
    environment: teardown
    timeout-minutes: 30
    steps:
      - name: Load, mask, and verify protected configuration
        shell: bash
        env:
          CONFIG_JSON: ${{ secrets.PROJECT_C_TEARDOWN_CONFIG }}
          ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test -n "$CONFIG_JSON" || { echo "Missing PROJECT_C_TEARDOWN_CONFIG." >&2; exit 1; }
          mappings=(
            role_arn:AWS_TEARDOWN_ROLE_ARN
            account_id:EXPECTED_AWS_ACCOUNT_ID
            repository_id:EXPECTED_REPOSITORY_ID
            cluster_name:ECS_CLUSTER_NAME
            service_name:ECS_SERVICE_NAME
            load_balancer_name:LOAD_BALANCER_NAME
            target_group_name:TARGET_GROUP_NAME
            security_group_id:ALB_SECURITY_GROUP_ID
          )
          for mapping in "${mappings[@]}"; do
            key="${mapping%%:*}"
            name="${mapping##*:}"
            value="$(jq -er --arg key "$key" '.[$key] | select(type == "string" and length > 0)' <<<"$CONFIG_JSON")"
            echo "::add-mask::$value"
            printf -v "$name" '%s' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          test "$ACTUAL_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"

      - name: Verify GitHub OIDC claims
        shell: bash
        env:
          EXPECTED_OIDC_SUBJECT: repo:nathanielecon@177059064/local-first-governed-cicd@1297706807:environment:teardown
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(jq -er '.value' <<<"$response")"
          echo "::add-mask::$token"
          OIDC_TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected_subject = os.environ["EXPECTED_OIDC_SUBJECT"]
          actual_issuer = claims.get("iss")
          actual_audience = claims.get("aud")
          actual_subject = claims.get("sub")
          if actual_issuer != "https://token.actions.githubusercontent.com":
              raise SystemExit(f"Unexpected OIDC issuer: {actual_issuer!r}")
          if actual_audience != "sts.amazonaws.com":
              raise SystemExit(f"Unexpected OIDC audience: {actual_audience!r}")
          if actual_subject != expected_subject:
              raise SystemExit(
                  f"Unexpected OIDC subject: {actual_subject!r}; "
                  f"expected {expected_subject!r}"
              )
          print(f"Verified OIDC subject: {actual_subject}")
          PY

      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ fromJSON(secrets.PROJECT_C_TEARDOWN_CONFIG).role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: project-c-teardown-${{ github.run_id }}
          mask-aws-account-id: true
          retry-max-attempts: 3

      - name: Verify non-root teardown identity
        shell: bash
        run: |
          set -euo pipefail
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          expected_role_name="${AWS_TEARDOWN_ROLE_ARN##*/}"
          test "$caller_account" = "$EXPECTED_AWS_ACCOUNT_ID"
          [[ "$caller_arn" =~ ^arn:aws:sts::[0-9]{12}:assumed-role/${expected_role_name}/ ]]
          echo "Verified expected non-root OIDC role."

      - name: Print deletion plan
        run: bash scripts/teardown/aws-project-c-teardown.sh

      - name: Execute deletion
        run: bash scripts/teardown/aws-project-c-teardown.sh --apply
