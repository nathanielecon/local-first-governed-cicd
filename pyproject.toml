[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "delivery-api"
version = "0.1.0"
description = "A small API used to demonstrate governed, digest-based CI/CD delivery."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["delivery_api"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=delivery_api --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

