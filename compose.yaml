name: project-c
services:
  registry:
    image: registry:2.8.3
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes: ["registry-data:/var/lib/registry"]
    networks: [delivery]

  staging:
    # Promotion identity is injected as an image reference and resolved to a digest at runtime.
    image: ${STAGING_IMAGE:-delivery-api:local}
    profiles: [deploy]
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: staging
      APP_READY: ${STAGING_READY:-true}
    ports: ["8081:8080"]
    networks: [delivery]

  production:
    # Promotion identity is injected as an image reference and resolved to a digest at runtime.
    image: ${PRODUCTION_IMAGE:-delivery-api:local}
    profiles: [deploy]
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_READY: ${PRODUCTION_READY:-true}
    ports: ["8082:8080"]
    networks: [delivery]

  jenkins:
    build: infra/jenkins
    restart: unless-stopped
    user: root
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      JENKINS_LOCAL_ADMIN_ID: ${JENKINS_LOCAL_ADMIN_ID:?Set JENKINS_LOCAL_ADMIN_ID in the local environment.}
      JENKINS_LOCAL_ADMIN_PASSWORD: ${JENKINS_LOCAL_ADMIN_PASSWORD:?Set JENKINS_LOCAL_ADMIN_PASSWORD in the local environment.}
      JENKINS_LOCAL_APPROVER_ID: ${JENKINS_LOCAL_APPROVER_ID:?Set JENKINS_LOCAL_APPROVER_ID in the local environment.}
      JENKINS_LOCAL_APPROVER_PASSWORD: ${JENKINS_LOCAL_APPROVER_PASSWORD:?Set JENKINS_LOCAL_APPROVER_PASSWORD in the local environment.}
      JENKINS_LOCAL_VIEWER_ID: ${JENKINS_LOCAL_VIEWER_ID:?Set JENKINS_LOCAL_VIEWER_ID in the local environment.}
      JENKINS_LOCAL_VIEWER_PASSWORD: ${JENKINS_LOCAL_VIEWER_PASSWORD:?Set JENKINS_LOCAL_VIEWER_PASSWORD in the local environment.}
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks: [delivery]

networks:
  delivery:
    name: project-c-delivery

volumes:
  registry-data:
  jenkins-data:
